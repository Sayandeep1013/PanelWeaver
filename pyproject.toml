[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panelweaver"
version = "0.0.1"
description = "AI-directed comic-to-video production pipeline"
readme = "docs/BUILD_GUIDE.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

cv = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "pypdfium2>=4.30",
]

[project.scripts]
panelweaver = "panelweaver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/panelweaver"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
